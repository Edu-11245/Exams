<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invertebrate Zoology - Lecture 1 Quiz</title>
<style>
:root{--bg:#EEF2F5;--card:#fff;--ink:#22303C;--mute:#66747F;--line:#D3DCE4;--main:#3F6B86;--deep:#2F4858;--ok:#3E7C6B;--okbg:#E4F1EC;--bad:#A8504A;--badbg:#F6E7E5;--soft:#E3EBF1}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#151C22;--card:#1E2830;--ink:#E4EAEF;--mute:#93A1AC;--line:#33424E;--main:#7FA9C4;--deep:#BBD0DE;--ok:#7CC1A9;--okbg:#1D3330;--bad:#E09A93;--badbg:#38252A;--soft:#26333D}}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Segoe UI",system-ui,"Noto Sans Arabic",Tahoma,sans-serif;padding:24px 14px 60px}
main{max-width:660px;margin:0 auto}
h1{font-size:26px;line-height:1.25;margin:0 0 6px;color:var(--deep)}
.sub{color:var(--mute);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.top{display:flex;justify-content:space-between;font-size:14px;color:var(--mute);margin-bottom:8px}
.bar{height:6px;background:var(--soft);border-radius:4px;overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;background:var(--main);transition:width .3s}
.q{font-size:19px;font-weight:600;line-height:1.45;margin:0 0 16px}
.opt{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--main);background:var(--soft)}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--main);outline-offset:2px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.exp{margin-top:6px;padding:12px 14px;border-radius:10px;background:var(--soft);direction:rtl;text-align:right;font-size:15px}
.btn{font:inherit;font-weight:600;background:var(--main);color:#fff;border:0;border-radius:10px;padding:11px 22px;cursor:pointer;margin:16px 10px 0 0}
.btn.alt{background:transparent;color:var(--main);border:1.5px solid var(--main)}
@media (prefers-color-scheme:dark){.btn{color:#12202A}}
.score{font-size:46px;font-weight:700;color:var(--deep);margin:4px 0}
.rev{border-top:1px solid var(--line);padding:12px 0;font-size:15px}
.rev b{display:block}
.rev span{color:var(--ok)}
.rev em{color:var(--bad);font-style:normal}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>Invertebrate Zoology: Lecture 1 Quiz</h1>
<p class="sub">28 questions on classification history, the 9 bases and the main phyla. Questions are in English, explanations in Arabic.</p>

<section class="card" id="start">
<p class="q">Ready to test yourself?</p>
<p class="sub">Options are shuffled every time. You see the answer and a short explanation after each question.</p>
<button class="btn" id="go">Start quiz</button>
</section>

<section class="card" id="play" hidden>
<div class="top"><span id="cnt"></span><span id="sc"></span></div>
<div class="bar"><i id="pb"></i></div>
<p class="q" id="qt"></p>
<div id="opts"></div>
<div class="exp" id="exp" hidden lang="ar"></div>
<button class="btn" id="nx" hidden>Next question</button>
</section>

<section class="card" id="end" hidden>
<p class="sub" style="margin:0">Your score</p>
<div class="score" id="fs"></div>
<p id="msg" class="sub"></p>
<button class="btn" id="rw" hidden>Retry wrong answers</button>
<button class="btn alt" id="ra">Restart all</button>
<div id="rv" style="margin-top:18px"></div>
</section>
</main>

<script>
// [question, correct, wrong, wrong, wrong, explanation (Arabic)]
const Q=[
["Who is known as the “Father of Zoology”?","Aristotle","John Ray","Linnaeus","Darwin","أرسطو (اليوناني، 384-322 ق.م) هو أبو علم الحيوان."],
["Anaima means animals…","without red blood (invertebrates)","with red blood (vertebrates)","that eat plants","that eat meat","Anaima من غير دم أحمر = لافقاريات. Enaima = بدم أحمر."],
["Aristotle’s second division of animals was based on…","their food (herbivorous / carnivorous)","their symmetry","their germ layers","their skeleton","قسّمهم حسب الأكل: آكل عشب وآكل لحوم."],
["Who divided living organisms into plant and animal kingdoms and defined the species?","John Ray","Aristotle","Linnaeus","Mendel","جون راي (إنجليزي، 1628-1705)."],
["The correct order from largest to smallest group is…","Kingdom, Phyla, Classes, Orders, Families, Genera, Species","Kingdom, Classes, Phyla, Orders, Genera, Families, Species","Species, Genera, Families, Orders, Classes, Phyla, Kingdom","Phyla, Kingdom, Orders, Classes, Families, Species, Genera","الترتيب: Kingdom > Phyla > Classes > Orders > Families > Genera > Species."],
["Which phrase is part of the definition of a species?","produce fertile offspring","live in the same habitat","have the same diet","have the same number of cells","النوع: متشابه شكلياً، بيتزاوج ويجيب نسل fertile (بيخلّف)."],
["Linnaeus recognized how many classes of the Animal Kingdom?","6","4","5","9","لينيوس: 6 classes (Mammalia, Aves, Amphibia, Pisces, Insecta, Vermes)."],
["In Linnaeus’s system, “Vermes” includes…","all other invertebrates","only worms","only fish","reptiles and amphibians","Vermes = كل اللافقاريات التانية."],
["Binomial nomenclature gives each organism a name made of…","2 Latin words","1 Greek word","3 Latin words","2 Arabic words","اسم من كلمتين لاتيني: genus + species."],
["Which is the correct way to write the scientific name?","Bufo regularis (capital genus, small species, in italics)","bufo Regularis","Bufo Regularis","bufo regularis","الـ genus بيبدأ Capital والـ species بيبدأ small، والاتنين italic أو تحتهم خط."],
["The first word of a scientific name is the…","genus (generic name)","species (specific name)","family","class","الكلمة الأولى = genus."],
["How many bases are used in animal kingdom classification (in this lecture)?","9","5","7","12","9 bases من cellular differentiation لحد unique features."],
["Protozoa are…","unicellular organisms","multicellular organisms","animals with a backbone","plants","Protozoa = خلية واحدة. Metazoa = أكتر من خلية."],
["Which animals are asymmetrical?","Most sponges","Birds","Insects","Starfish","معظم الإسفنج asymmetrical."],
["Spherical symmetry is found in…","Volvox","Earthworm","Butterfly","Eagle","Volvox مستعمرة flagellate protozoan، شكلها كورة."],
["Radial symmetry is found in…","Echinoderms","Insects","Birds","Reptiles","Radial: بعض الإسفنج، Cnidarians، Echinoderms."],
["Bilateral symmetry is found in…","Aves, insects and reptiles","Volvox","Sea urchins","Sea anemones","Bilateral = نصين يمين وشمال، زي الطيور والحشرات والزواحف."],
["The upper surface (back) of a bilateral animal is called…","Dorsal","Ventral","Anterior","Posterior","Dorsal = الضهر. Ventral = البطن. Anterior = الأمام. Posterior = الخلف."],
["Diploblastic animals have which germ layers?","Ectoderm and endoderm","Ectoderm and mesoderm","Mesoderm and endoderm","Ectoderm, mesoderm and endoderm","Diplo = 2: ecto + endo. وبتنقص الـ mesoderm."],
["A diploblastic phylum is…","Cnidaria (Coelenterata)","Annelida","Chordata","Platyhelminthes","Cnidaria هي المثال في المحاضرة."],
["Metamerism is…","the linear repetition of parts in the body","the number of germ layers","the type of body cavity","the type of skeleton","Metamerism = تكرار خطي للأجزاء، كل جزء metamere أو somite."],
["Segments are similar and clear both externally and internally in…","Annelids","Arthropods","Nematodes","Cnidarians","Annelids: متشابهة وواضحة من بره ومن جوه."],
["In Arthropods the segments are…","dissimilar (heteronomous) and clear only externally","similar and clear internally","absent","similar and clear in and out","Arthropods: مختلفة وواضحة من بره بس."],
["The coelom is completely lined with tissue derived from the…","mesoderm","ectoderm","endoderm","blastocoel","الـ coelom جداره من الـ mesoderm."],
["Which is NOT a function of the coelom?","Photosynthesis","Shock absorption","Organ independence","Hydrostatic skeleton","وظايف الـ coelom: shock absorption وorgan independence وhydrostatic skeleton."],
["Acoelomata (no body cavity) is represented by phylum…","Platyhelminthes","Nematoda","Chordata","Cnidaria","Acoelomata = Platyhelminthes، والـ mesoderm مليّا المكان."],
["A pseudocoel is…","a false coelom not lined with peritoneum","a true coelom lined with peritoneum","absent in all animals","found only in Chordates","Pseudocoelomata مثالها Nematoda."],
["Earthworms are hermaphroditic. This term means…","male and female organs in the same individual","each individual is either male or female","no sex organs","sex is separate","Hermaphroditic = monoecious. Dioecious = unisexual."],
["Match the unique feature: cnidocytes, flame cells, nephridia.","Cnidaria, Platyhelminthes, Annelida","Annelida, Cnidaria, Platyhelminthes","Platyhelminthes, Annelida, Cnidaria","Nematoda, Chordata, Arthropoda","Cnidocytes = Cnidaria. Flame cells = Platyhelminthes. Nephridia = Annelida."]
];
const $=id=>document.getElementById(id);
let list,i,score,wrong,locked;
const sh=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
function show(id){["start","play","end"].forEach(s=>$(s).hidden=s!==id)}
function begin(qs){list=sh(qs);i=0;score=0;wrong=[];show("play");render()}
function render(){
  const q=list[i];locked=false;
  $("cnt").textContent="Question "+(i+1)+" of "+list.length;
  $("sc").textContent="Score: "+score;
  $("pb").style.width=(i/list.length*100)+"%";
  $("qt").textContent=q[0];$("exp").hidden=true;$("nx").hidden=true;
  $("opts").innerHTML="";
  sh(q.slice(1,5).map((t,k)=>({t,ok:k===0}))).forEach(o=>{
    const b=document.createElement("button");b.className="opt";b.textContent=o.t;b.onclick=()=>pick(b,o);b.dataset.ok=o.ok?1:0;
    $("opts").appendChild(b)});
}
function pick(b,o){
  if(locked)return;locked=true;
  const q=list[i];
  document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.ok==="1")x.classList.add("ok")});
  if(o.ok){score++}else{b.classList.add("no");wrong.push({q,pick:o.t})}
  $("sc").textContent="Score: "+score;
  $("exp").textContent=q[5];$("exp").hidden=false;
  $("nx").textContent=i===list.length-1?"See results":"Next question";$("nx").hidden=false;$("nx").focus();
}
$("nx").onclick=()=>{i++;i<list.length?render():finish()};
function finish(){
  show("end");const p=Math.round(score/list.length*100);
  $("fs").textContent=score+" / "+list.length+" ("+p+"%)";
  $("msg").textContent=p>=90?"Excellent. You know this lecture well.":p>=70?"Good. Review the questions you missed below.":"Keep going. Read the summary again, then retry the wrong answers.";
  $("rw").hidden=!wrong.length;
  $("rv").innerHTML=wrong.map(w=>'<div class="rev"><b></b><em></em><br><span></span></div>').join("");
  [...$("rv").children].forEach((d,k)=>{const w=wrong[k];d.querySelector("b").textContent=w.q[0];d.querySelector("em").textContent="Your answer: "+w.pick;d.querySelector("span").textContent="Correct: "+w.q[1]});
}
$("go").onclick=()=>begin(Q);
$("ra").onclick=()=>begin(Q);
$("rw").onclick=()=>begin(wrong.map(w=>w.q));
</script>
</body>
</html>
